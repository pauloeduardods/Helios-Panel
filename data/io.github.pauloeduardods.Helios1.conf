<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (heliosd) may own the name. -->
  <policy user="root">
    <allow own="io.github.pauloeduardods.Helios1"/>
  </policy>

  <!-- Anyone may read and call; polkit, not this file, decides on writes. -->
  <policy context="default">
    <allow send_destination="io.github.pauloeduardods.Helios1"
           send_interface="io.github.pauloeduardods.Helios1.Daemon"/>
    <allow send_destination="io.github.pauloeduardods.Helios1"
           send_interface="io.github.pauloeduardods.Helios1.Sensors"/>
    <allow send_destination="io.github.pauloeduardods.Helios1"
           send_interface="io.github.pauloeduardods.Helios1.Profile"/>
    <allow send_destination="io.github.pauloeduardods.Helios1"
           send_interface="io.github.pauloeduardods.Helios1.Lighting"/>
    <allow send_destination="io.github.pauloeduardods.Helios1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.github.pauloeduardods.Helios1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.pauloeduardods.Helios1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
