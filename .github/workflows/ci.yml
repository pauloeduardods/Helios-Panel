name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the required status check on main ("checks"); renaming it
  # means updating the "Protect main" ruleset too.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-bin dbus-daemon

      - name: npm test
        run: npm test

      - name: npm run check
        run: npm run check

      - name: Kernel module (build and checkpatch)
        run: |
          # Ubuntu's generic kernel headers, the kernel users run (not the
          # runner's own Azure kernel).
          sudo apt-get install -y -qq linux-headers-generic
          kdir="$(ls -d /usr/src/linux-headers-*-generic | sort -V | tail -1)"
          echo "building against $kdir"
          make -C kmod/helios-acer-lighting KDIR="$kdir" W=1
          "$kdir/scripts/checkpatch.pl" --no-tree --strict \
            --ignore PREFER_KERNEL_TYPES \
            -f kmod/helios-acer-lighting/{driver.c,lighting.c,lighting.h}

      - name: shellcheck
        run: shellcheck install.sh

      - name: Validate GSettings schema and data files
        run: |
          glib-compile-schemas --strict --dry-run extension/schemas
          for f in data/*.conf data/*.policy; do
            python3 -c 'import sys, xml.dom.minidom as m; m.parse(sys.argv[1])' "$f"
          done
          systemd-analyze security --offline=true data/heliosd.service | tail -1

      # Rust workspace (helios-core, heliosd, heliosctl): these steps start
      # running as soon as a Cargo.toml lands at the repository root.
      - name: cargo fmt
        if: hashFiles('Cargo.toml') != ''
        run: |
          rustup component add rustfmt
          cargo fmt --all --check

      - name: cargo test
        if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace --locked

      - name: cargo clippy
        if: hashFiles('Cargo.toml') != ''
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets --locked -- -D warnings
