name: Hardware report
description: Tell us how Helios Panel works on your laptop or PC, whether it works or not.
title: "hardware: <vendor> <model>"
labels: ["hardware"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Reports like this one fill the tested machines table in
        [docs/HARDWARE.md](https://github.com/pauloeduardods/Helios-Panel/blob/main/docs/HARDWARE.md).
        Everything below only reads; nothing is changed on your machine.
  - type: input
    id: machine
    attributes:
      label: Machine
      description: "Output of: cat /sys/class/dmi/id/{sys_vendor,product_name,product_family,bios_version}"
      placeholder: Acer Predator PHN16-72 (Predator Helios Neo 16), V1.20
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, kernel and GNOME version
      description: "e.g. Ubuntu 24.04, uname -r, gnome-shell --version"
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: CPU temperature
        - label: GPU temperature
        - label: Fan speeds
        - label: Battery readings
        - label: Profile switching
        - label: Keyboard or logo lighting
  - type: textarea
    id: status
    attributes:
      label: heliosctl status --json
      render: json
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: heliosctl doctor
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Readings that are missing or wrong, profiles that do not switch, etc.
